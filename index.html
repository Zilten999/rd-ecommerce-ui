<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RD Ecommerce Group</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">RD GROUP</div>
  <div class="lang">BG ▾</div>
</header>

<!-- MAIN -->
<main class="container">

  <!-- BALANCE CARD -->
  <section class="balance-card">
    <div class="level">T2</div>
    <div class="balance-title">Личен баланс</div>
    <div class="balance-amount">109.80 <span>USDT</span></div>
  </section>

  <!-- STATS -->
  <section class="stats-grid">
    <div class="stat blue">
      <span>Днешни приходи</span>
      <strong>54.72</strong>
    </div>
    <div class="stat purple">
      <span>Вчерашни</span>
      <strong>54.72</strong>
    </div>
    <div class="stat orange">
      <span>Този месец</span>
      <strong>1144.80</strong>
    </div>
    <div class="stat green">
      <span>Общо</span>
      <strong>2796.80</strong>
    </div>
    <div class="stat pink">
      <span>Мин. месец</span>
      <strong>1170.00</strong>
    </div>
    <div class="stat dark">
      <span>Задачи днес</span>
      <strong>18 / 18</strong>
    </div>
  </section>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="nav-item active"><i class="fa fa-house"></i><span>Начало</span></div>
  <div class="nav-item"><i class="fa fa-list"></i><span>Задачи</span></div>
  <div class="nav-item"><i class="fa fa-gem"></i><span>Позиция</span></div>
  <div class="nav-item"><i class="fa fa-users"></i><span>Екип</span></div>
  <div class="nav-item"><i class="fa fa-user"></i><span>Моят</span></div>
</nav>

</body>
</html>
